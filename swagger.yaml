        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'
    put:
      tags: [Tournaments]
      summary: Update a tournament (partial)
      description: The slug never changes. Finished or cancelled tournaments are read-only. match_format is locked after the first result (code format_locked).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Any subset of the fields accepted on creation, except slug
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  tournament: {$ref: '#/components/schemas/Tournament'}
        '400':
          description: Invalid data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'
        '409':
          description: Read-only or format locked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'
    delete:
