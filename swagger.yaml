  /api/admin/tournaments/{tournament_id}/registrations/{registration_id}/unavailability:
    parameters:
      - {name: tournament_id, in: path, required: true, schema: {type: integer}}
      - {name: registration_id, in: path, required: true, schema: {type: integer}}
    get:
      tags: [Tournaments]
      summary: Impediments of a registration
      description: "Days and times when the player cannot play. Private: never in a public response. They count for every registration of the same person."
      security:
        - BearerAuth: []
      responses:
        '200':
          description: The impediments and the other categories of the same person
          content:
            application/json:
              schema:
                type: object
                properties:
                  registration: {type: object, properties: {id: {type: integer}, display_name: {type: string}, category_name: {type: string}}}
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/TournamentUnavailabilityItem'}
                  also_in:
                    type: array
                    items: {type: object, properties: {registration_id: {type: integer}, category_id: {type: integer}, category_name: {type: string}}}
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'
    put:
      tags: [Tournaments]
      summary: Replace the impediments of a registration
      description: Each item is a date inside the tournament period and either no times (the whole day) or a start and an end. Up to 60.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      date: {type: string, format: date}
                      start: {type: string, nullable: true}
                      end: {type: string, nullable: true}
                      note: {type: string, nullable: true}
      responses:
        '200':
          description: The impediments after the change
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/TournamentUnavailabilityItem'}
        '400':
          description: Invalid data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'
        '409':
          description: Refused (see code)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'
