openapi: 3.0.4
info:
  title: LAPEN Agenda API
  description: Tennis Court Management System with Betting Integration
  version: 1.0.0
  contact:
    email: lapen.ptc@gmail.com

servers:
  - url: http://localhost:5001
    description: Development server

tags:
  - name: Public
    description: Public endpoints for schedules and courts
  - name: Auth
    description: User authentication and registration
  - name: Admin
    description: Admin panel operations
  - name: Matches
    description: Match management
  - name: Admin Matches
    description: Admin match operations
  - name: Betting
    description: Betting operations
  - name: Payments
    description: Payment processing
  - name: Statistics
    description: Match statistics and player performance
  - name: Tournaments
    description: Tournament module (public sign-up and admin management)

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    AdminSession:
      type: apiKey
      in: cookie
      name: session

  schemas:
    Court:
      type: object
      required:
        - id
        - name
        - type
        - active
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Quadra 1"
        type:
          type: string
          example: "saibro"
        description:
          type: string
          example: "Quadra principal"
        active:
          type: boolean
          example: true
        image_url:
          type: string
          example: "/images/court_1.jpg"

    Schedule:
      type: object
      required:
        - court_id
        - date
        - start_time
        - player1_name
        - player2_name
        - match_type
      properties:
        id:
          type: integer
          example: 1
        court_id:
          type: integer
          example: 1
        date:
          type: string
          format: date
          example: "2024-01-15"
        start_time:
          type: string
          example: "09:00"
        player1_name:
          type: string
          example: "João Silva"
        player2_name:
          type: string
          example: "Maria Santos"
        match_type:
          type: string
          enum: [Liga, Amistoso, Aula, Torneio]
          example: "Liga"

    Match:
      type: object
      properties:
        schedule_id:
          type: integer
          example: 1
        match_id:
          type: integer
          example: 1
        court_name:
          type: string
          example: "Quadra 1"
        date:
          type: string
          example: "2024-01-15"
        start_time:
          type: string
          example: "09:00"
        player1_name:
          type: string
          example: "João Silva"
        player2_name:
          type: string
          example: "Maria Santos"
        match_type:
          type: string
          example: "Liga"
        status:
          type: string
          enum: [upcoming, live, finished, cancelled]
          example: "upcoming"
        betting_enabled:
          type: boolean
          example: true
        total_pool:
          type: number
          format: float
          example: 150.00
        user_has_bet:
          type: boolean
          example: false

    User:
      type: object
      required:
        - id
        - email
        - name
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          format: email
          example: "user@example.com"
        name:
          type: string
          example: "João Silva"
        phone:
          type: string
          example: "+5511999999999"
        is_verified:
          type: boolean
          example: true

    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: "Error message description"

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Operation completed successfully"

    Tournament:
      type: object
      properties:
        id: {type: integer, example: 1}
        name: {type: string, example: "Copa LAPEN 2026"}
        slug: {type: string, example: "copa-lapen-2026"}
        description: {type: string, nullable: true}
        location: {type: string, nullable: true}
        start_date: {type: string, format: date, example: "2026-11-10"}
        end_date: {type: string, format: date, example: "2026-11-12"}
        registration_opens_at: {type: string, format: date-time, nullable: true, description: "Brazil local time, no timezone"}
        registration_closes_at: {type: string, format: date-time, nullable: true, description: "Brazil local time, no timezone"}
        rules_text: {type: string, nullable: true}
        contact_info: {type: string, nullable: true}
        match_format:
          type: string
          enum: [best_of_3_super_tb, pro_set_8, single_set_6]
          description: Chosen when the tournament is created, locked after the first result
        no_ad: {type: boolean}
        match_tiebreak_points: {type: integer, example: 10}
        status:
          type: string
          enum: [draft, registration_open, registration_closed, in_progress, finished, cancelled]
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    TournamentCategory:
      type: object
      properties:
        id: {type: integer}
        tournament_id: {type: integer}
        name: {type: string, example: "Masculino 3a Classe"}
        max_entries: {type: integer, nullable: true, description: null means no limit}
        min_entries: {type: integer, example: 4}
        draw_format: {type: string, enum: [knockout, round_robin, groups_knockout]}
        group_target_size: {type: integer, nullable: true, enum: [3, 4]}
        qualifiers_per_group: {type: integer, nullable: true, enum: [1, 2]}
        num_seeds: {type: integer}
        wo_tolerance_min: {type: integer, example: 15}
        min_rest_min: {type: integer, example: 30}
        status:
          type: string
          enum: [awaiting_draw, drawn, published, group_stage, knockout_stage, finished]
        sort_order: {type: integer}
        counts:
          type: object
          description: Registrations per status (only on the tournament detail)
          additionalProperties: {type: integer}

    TournamentRegistration:
      type: object
      description: Admin view. Contact data is never exposed by public endpoints.
      properties:
        id: {type: integer}
        category_id: {type: integer}
        user_id: {type: integer, nullable: true, description: Set only for approved LAPEN members}
        is_member: {type: boolean}
        full_name: {type: string}
        display_name: {type: string}
        email: {type: string}
        phone: {type: string, description: Digits only}
        notes: {type: string, nullable: true}
        status:
          type: string
          enum: [pending, confirmed, rejected, cancelled, waitlist, withdrawn]
        seed: {type: integer, nullable: true}
        rejection_reason: {type: string, nullable: true}
        terms_accepted_at: {type: string, format: date-time}
        data_consent_at: {type: string, format: date-time}
        reviewed_at: {type: string, format: date-time, nullable: true}
        created_at: {type: string, format: date-time}

    TournamentError:
      type: object
      properties:
        error: {type: string}
        code: {type: string, description: "Stable machine-readable reason", example: active_tournament_exists}

    TournamentMatch:
      type: object
      properties:
        id: {type: integer}
        stage: {type: string, enum: [group, knockout]}
        group_id: {type: integer, nullable: true}
        round_number: {type: integer}
        round_name: {type: string, description: Knockout only, example: Semifinal}
        bracket_position: {type: integer, description: 1-based order inside the round (inside the group for group matches)}
        entry1: {$ref: '#/components/schemas/TournamentDrawEntry'}
        entry2: {$ref: '#/components/schemas/TournamentDrawEntry'}
        entry1_source: {type: string, nullable: true, description: "Where an open slot comes from, e.g. 1o Grupo A or Vencedor das quartas 2"}
        entry2_source: {type: string, nullable: true}
        status: {type: string, enum: [pending, completed]}
        outcome: {type: string, nullable: true, enum: [normal, wo, double_wo, retired, bye]}
        winner_entry_id: {type: integer, nullable: true}
        score: {type: string, nullable: true, description: "From the first player's side. W.O. for a walkover, a trailing ret. for a retirement"}
        played_at: {type: string, format: date-time, nullable: true}
        next_match_id: {type: integer, nullable: true}
        next_slot: {type: integer, nullable: true, enum: [1, 2]}

    TournamentDrawEntry:
      type: object
      nullable: true
      description: A registration placed in a slot. null for a bye or for a slot still waiting for its source.
      properties:
        registration_id: {type: integer}
        display_name: {type: string}
        seed: {type: integer, nullable: true}

    TournamentDraw:
      type: object
      properties:
        category: {$ref: '#/components/schemas/TournamentCategory'}
        draw:
          type: object
          properties:
            format: {type: string, enum: [knockout, round_robin, groups_knockout]}
            groups:
              type: array
              items:
                type: object
                properties:
                  id: {type: integer}
                  name: {type: string, example: A}
                  entries:
                    type: array
                    items: {$ref: '#/components/schemas/TournamentDrawEntry'}
                  matches:
                    type: array
                    items: {$ref: '#/components/schemas/TournamentMatch'}
            knockout:
              type: object
              nullable: true
              properties:
                size: {type: integer, example: 8}
                rounds:
                  type: array
                  items:
                    type: object
                    properties:
                      round_number: {type: integer}
                      name: {type: string}
                      matches:
                        type: array
                        items: {$ref: '#/components/schemas/TournamentMatch'}
            knockout_pending:
              type: boolean
              description: True for groups_knockout when the qualifiers do not fill a bracket. The knockout phase is built when the groups end.
        warnings:
          type: array
          items: {type: string}
          description: Only on generation, e.g. pending registrations left out of the draw

    TournamentResult:
      type: object
      properties:
        match_id: {type: integer}
        category: {$ref: '#/components/schemas/TournamentCategory'}
        draw:
          type: object
          description: Same as TournamentDraw.draw, after the result and everything it set in motion
        standings:
          type: array
          description: Group formats only
          items: {$ref: '#/components/schemas/TournamentGroupStandings'}

    TournamentGroupStandings:
      type: object
      properties:
        id: {type: integer}
        name: {type: string, example: A}
        complete: {type: boolean, description: Every match of the group has a result}
        blocked: {type: boolean, description: A tie that matters is waiting for the organizer}
        confirmed: {type: boolean, description: Complete and not blocked. The qualifiers are final}
        ties:
          type: array
          items:
            type: object
            properties:
              entries:
                type: array
                items: {$ref: '#/components/schemas/TournamentDrawEntry'}
              relevant: {type: boolean, description: True when the tie reaches the qualifying places}
        rows:
          type: array
          items:
            type: object
            properties:
              registration_id: {type: integer}
              display_name: {type: string}
              seed: {type: integer, nullable: true}
              position: {type: integer, description: Tied players share a position}
              tied: {type: boolean}
              state:
                type: string
                enum: [provisional, open, qualified, eliminated, tie_pending]
              played: {type: integer, description: Matches with a result, walkovers included}
              played_on_court: {type: integer, description: Walkovers do not count}
              wins: {type: integer}
              losses: {type: integer}
              sets_won: {type: integer}
              sets_lost: {type: integer}
              games_won: {type: integer}
              games_lost: {type: integer}
              sets_pct: {type: number}
              games_pct: {type: number}

    PublicTournament:
      type: object
      description: Public view. Drafts and cancelled tournaments are not public.
      properties:
        id: {type: integer}
        name: {type: string}
        slug: {type: string}
        description: {type: string, nullable: true}
        location: {type: string, nullable: true}
        start_date: {type: string, format: date}
        end_date: {type: string, format: date}
        rules_text: {type: string, nullable: true}
        contact_info: {type: string, nullable: true}
        match_format: {type: string, enum: [best_of_3_super_tb, pro_set_8, single_set_6]}
        no_ad: {type: boolean}
        match_tiebreak_points: {type: integer}
        format_text: {type: string, example: "2 sets sem vantagem + super tie-break de 10 pts"}
        status: {type: string, enum: [registration_open, registration_closed, in_progress, finished]}
        registration:
          type: object
          properties:
            open: {type: boolean, description: True while the sign-up page accepts registrations}
            state: {type: string, enum: [not_started, open, closed]}
            opens_at: {type: string, format: date-time, nullable: true}
            closes_at: {type: string, format: date-time, nullable: true}

    PublicEntry:
      type: object
      nullable: true
      description: A player. Only the display name and seed are ever public.
      properties:
        id: {type: integer}
        display_name: {type: string}
        seed: {type: integer, nullable: true}
        withdrawn: {type: boolean}

    PublicMatch:
      type: object
      properties:
        id: {type: integer}
        stage: {type: string, enum: [group, knockout]}
        group: {type: string, nullable: true, example: A}
        round_number: {type: integer}
        round_name: {type: string, description: Knockout only}
        position: {type: integer}
        sides:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: object
            properties:
              entry: {$ref: '#/components/schemas/PublicEntry'}
              source: {type: string, nullable: true, description: "Where an open slot comes from, e.g. 1o Grupo A, Vencedor das quartas 2 or Sem adversario (duplo W.O.). An empty side without source on a bye match is the BYE"}
        status: {type: string, enum: [pending, completed]}
        outcome: {type: string, nullable: true, enum: [normal, wo, double_wo, retired, bye]}
        score: {type: string, nullable: true}
        winner_side: {type: integer, nullable: true, enum: [1, 2]}
        played_at: {type: string, format: date-time, nullable: true}
        planned_date: {type: string, format: date, nullable: true}
        planned_time: {type: string, nullable: true, example: "09:30"}
        court: {type: string, nullable: true}

    PublicCategorySummary:
      type: object
      properties:
        id: {type: integer}
        name: {type: string}
        draw_format: {type: string, enum: [knockout, round_robin, groups_knockout]}
        status: {type: string, enum: [awaiting_draw, published, group_stage, knockout_stage, finished], description: A draw that is only a preview shows as awaiting_draw}
        stage:
          type: object
          properties:
            current: {type: string, enum: [registration, groups, knockout, final, champion]}
            steps:
              type: array
              items:
                type: object
                properties:
                  key: {type: string}
                  label: {type: string, example: "Mata-mata"}
                  state: {type: string, enum: [done, current, upcoming]}
        progress:
          type: object
          description: Matches with a result over matches to be played. Byes are not matches. Phases not built yet are not counted
          properties:
            done: {type: integer}
            total: {type: integer}
            group: {type: object, properties: {done: {type: integer}, total: {type: integer}}}
            knockout: {type: object, properties: {done: {type: integer}, total: {type: integer}}}
        capacity:
          type: object
          properties:
            confirmed: {type: integer}
            max_entries: {type: integer, nullable: true}
            min_entries: {type: integer}
        group_target_size: {type: integer, nullable: true}
        qualifiers_per_group: {type: integer, nullable: true}
        num_seeds: {type: integer}
        wo_tolerance_min: {type: integer}
        min_rest_min: {type: integer}
        draw_published: {type: boolean}
        champion: {$ref: '#/components/schemas/PublicEntry'}
        runner_up: {$ref: '#/components/schemas/PublicEntry'}

    PublicCategory:
      type: object
      description: Everything the tracking screen needs for one category, in a single response.
      properties:
        tournament: {$ref: '#/components/schemas/PublicTournament'}
        category: {$ref: '#/components/schemas/PublicCategorySummary'}
        entries:
          type: array
          description: Confirmed registrations only, seeds first
          items: {$ref: '#/components/schemas/PublicEntry'}
        groups:
          type: array
          items:
            type: object
            properties:
              id: {type: integer}
              name: {type: string}
              complete: {type: boolean}
              blocked: {type: boolean}
              confirmed: {type: boolean}
              qualifiers: {type: integer}
              ties:
                type: array
                items:
                  type: object
                  properties:
                    entries:
                      type: array
                      items: {$ref: '#/components/schemas/PublicEntry'}
                    relevant: {type: boolean}
              rows:
                type: array
                items:
                  type: object
                  properties:
                    entry: {$ref: '#/components/schemas/PublicEntry'}
                    position: {type: integer}
                    tied: {type: boolean}
                    state: {type: string, enum: [provisional, open, qualified, eliminated, tie_pending]}
                    played: {type: integer}
                    wins: {type: integer}
                    losses: {type: integer}
                    sets_won: {type: integer}
                    sets_lost: {type: integer}
                    sets_diff: {type: integer}
                    games_won: {type: integer}
                    games_lost: {type: integer}
                    games_diff: {type: integer}
                    destination: {type: string, nullable: true, example: "Semifinal 1", description: Where a qualified player goes next}
              matches:
                type: array
                items: {$ref: '#/components/schemas/PublicMatch'}
        bracket:
          type: object
          nullable: true
          properties:
            size: {type: integer}
            rounds:
              type: array
              items:
                type: object
                properties:
                  round_number: {type: integer}
                  name: {type: string}
                  matches:
                    type: array
                    items: {$ref: '#/components/schemas/PublicMatch'}
        knockout_pending: {type: boolean, description: "True when the knockout phase will be drawn at the end of the groups"}
        upcoming:
          type: array
          description: Up to 5 games ready to be played, scheduled ones first
          items: {$ref: '#/components/schemas/PublicMatch'}
        results:
          type: array
          description: Up to 5 most recent results
          items: {$ref: '#/components/schemas/PublicMatch'}

    ScheduleWindow:
      type: object
      description: A court on a day at a start time (90 minutes)
      properties:
        court_id: {type: integer}
        date: {type: string, format: date}
        time: {type: string, example: "08:00"}

    ScheduleMatch:
      type: object
      properties:
        id: {type: integer}
        category_id: {type: integer}
        category_name: {type: string}
        stage: {type: string, enum: [group, knockout]}
        round_number: {type: integer}
        round_name: {type: string, example: "Grupo A · Rodada 1"}
        group: {type: string, nullable: true}
        status: {type: string, enum: [pending, completed]}
        outcome: {type: string, nullable: true}
        score: {type: string, nullable: true}
        locked: {type: boolean, description: Pinned matches are not moved by the automatic distribution or by hand}
        window: {allOf: [{$ref: '#/components/schemas/ScheduleWindow'}], nullable: true}
        sides:
          type: array
          items:
            type: object
            properties:
              registration_id: {type: integer, nullable: true}
              name: {type: string, description: Display name or the origin of an open slot}
              defined: {type: boolean}
        people: {type: array, items: {type: integer}, description: Person ids (same member or e-mail share one)}

    ScheduleConflict:
      type: object
      properties:
        kind: {type: string, enum: [overlap, order, rest, unavailable, invalid_window]}
        severity: {type: string, enum: [error, warning], description: Errors stop an edit. Warnings need confirmation (force)}
        match_ids: {type: array, items: {type: integer}}
        people: {type: array, items: {type: integer}}
        people_names: {type: array, items: {type: string}}
        message: {type: string}
        detail: {type: object}

    Schedule:
      type: object
      properties:
        tournament:
          type: object
          properties:
            id: {type: integer}
            start_date: {type: string, format: date}
            end_date: {type: string, format: date}
            status: {type: string}
            schedule_published_at: {type: string, format: date-time, nullable: true}
        slot_minutes: {type: integer, example: 90}
        courts:
          type: array
          description: Active courts (read only, from the courts table)
          items: {type: object, properties: {id: {type: integer}, name: {type: string}}}
        sessions:
          type: array
          items:
            type: object
            properties:
              id: {type: integer}
              date: {type: string, format: date}
              start: {type: string, example: "08:00"}
              end: {type: string, example: "17:00"}
              court_ids: {type: array, items: {type: integer}}
              windows: {type: integer}
              leftover_minutes: {type: integer, description: Minutes at the end that do not make a whole window}
        windows:
          type: array
          items:
            type: object
            properties:
              court_id: {type: integer}
              date: {type: string, format: date}
              time: {type: string}
              session_id: {type: integer}
              blocked: {type: boolean}
        matches:
          type: array
          items: {$ref: '#/components/schemas/ScheduleMatch'}
        conflicts:
          type: array
          items: {$ref: '#/components/schemas/ScheduleConflict'}
        summary:
          type: object
          properties:
            pending: {type: integer}
            placed: {type: integer}
            unplaced: {type: integer}
            windows: {type: integer}
            free_windows: {type: integer}

    ScheduleProposal:
      type: object
      description: A proposal. Nothing is written until it is applied
      properties:
        rng_seed: {type: integer, description: The same options and seed give the same proposal}
        assignments:
          type: array
          items:
            type: object
            properties:
              match_id: {type: integer}
              court_id: {type: integer}
              date: {type: string, format: date}
              time: {type: string}
              previous: {allOf: [{$ref: '#/components/schemas/ScheduleWindow'}], nullable: true}
              label: {type: string}
        unassign: {type: array, items: {type: integer}, description: Matches that had a window and ended up without one (redo)}
        unplaced:
          type: array
          items:
            type: object
            properties:
              match_id: {type: integer}
              label: {type: string}
              reasons: {type: array, items: {type: string}}
        metrics:
          type: object
          properties:
            placed: {type: integer}
            ends_at: {type: string, format: date-time, nullable: true}
            max_wait_minutes: {type: integer}
            max_matches_per_person_day: {type: integer}
        feasibility:
          type: object
          properties:
            matches: {type: integer}
            windows: {type: integer}
            shortfall: {type: integer}
            time_steps: {type: integer}
            hint: {type: string}
            busiest: {type: object, properties: {name: {type: string}, matches: {type: integer}}}
        conflicts: {type: array, items: {$ref: '#/components/schemas/ScheduleConflict'}, description: Always empty unless something changed while computing}

    TournamentUnavailabilityItem:
      type: object
      properties:
        id: {type: integer}
        date: {type: string, format: date}
        start: {type: string, nullable: true, example: "14:00"}
        end: {type: string, nullable: true, example: "18:00"}
        whole_day: {type: boolean}
        note: {type: string, nullable: true, maxLength: 200}

  responses:
    UnauthorizedError:
      description: Authentication information is missing or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Unauthorized"
    
    NotFoundError:
      description: The specified resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Resource not found"
    
    BadRequestError:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Invalid request parameters"

paths:
  /api/public/courts:
    get:
      tags:
        - Public
      summary: Get all active courts
      responses:
        '200':
          description: List of active courts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Court'
              example:
                - id: 1
                  name: "Quadra 1"
                  type: "saibro"
                  description: "Quadra principal"
                  active: true
                  image_url: "/images/court_1.jpg"

  /api/public/players:
    get:
      tags:
        - Public
      summary: Get all players for autocomplete
      responses:
        '200':
          description: List of player names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
              example:
                - "João Silva"
