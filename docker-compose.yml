services:
  postgres:
    image: postgres:15-alpine
    container_name: lapen-postgres
    environment:
      POSTGRES_DB: lapen_agenda
      POSTGRES_USER: lapen_user
      POSTGRES_PASSWORD: lapen_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lapen_user -d lapen_agenda"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lapen-backend
    ports:
      - "5001:5001"
    env_file:
      - .env.docker
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.venv
    restart: unless-stopped

volumes:
  postgres_data:
