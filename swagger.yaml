      - {name: tournament_id, in: path, required: true, schema: {type: integer}}
    get:
      tags: [Tournaments]
      summary: Tournament with its categories and registration counts
      description: Registrations whose deadline passed are closed lazily when this is read.
      security:
        - BearerAuth: []
      responses:
