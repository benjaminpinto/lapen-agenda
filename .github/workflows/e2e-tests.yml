name: E2E Tests

on:
  repository_dispatch:
    types:
      - 'vercel.deployment.success'

permissions:
  contents: write

jobs:
  e2e-tests:
    if: github.event_name == 'repository_dispatch' && github.event.client_payload.environment == 'preview'
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Install Playwright browsers
      run: npx playwright install --with-deps
    
    - name: Run Playwright tests
      run: npx playwright test
      env:
        CI: true
        BASE_URL: ${{ github.event.client_payload.url }}
        ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        MAIL_MOCK_ACTIVE: true
    
    - name: Check allure-results
      if: always()
      run: |
        echo "Checking allure-results directory..."
        ls -la allure-results/ || echo "allure-results directory not found"
        echo "File count: $(find allure-results -type f 2>/dev/null | wc -l)"
    
    - name: Load test report history
      uses: actions/checkout@v3
      if: always()
      continue-on-error: true
      with:
        ref: gh-pages
        path: gh-pages
    
    - name: Build Allure report
      uses: simple-elf/allure-report-action@v1.10
      if: always()
      with:
        gh_pages: gh-pages
        allure_history: allure-history
        allure_results: allure-results
    
    - name: Publish Allure report to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      if: always()
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: allure-history
    
    - name: Upload Playwright HTML report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    - name: 'notify vercel'
      uses: 'vercel/repository-dispatch/actions/status@v1'
      with:
        name:
          'Vercel - lapen-agenda: E2E Check'
