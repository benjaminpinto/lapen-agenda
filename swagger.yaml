  /api/admin/tournaments/{tournament_id}/status:
    parameters:
      - {name: tournament_id, in: path, required: true, schema: {type: integer}}
    put:
      tags: [Tournaments]
      summary: Change the tournament status
      description: |
        Allowed moves: draft to registration_open or cancelled, registration_open to registration_closed or cancelled,
        registration_closed to registration_open, in_progress or cancelled, in_progress to finished or cancelled.
        Only one tournament can be active (registration_open, registration_closed, in_progress) at a time:
        opening a second one returns 409 with code active_tournament_exists and the blocking tournament in active_tournament.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: {type: string, enum: [registration_open, registration_closed, in_progress, finished, cancelled]}
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  tournament: {$ref: '#/components/schemas/Tournament'}
        '400':
          description: Unknown status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'
        '409':
          description: Invalid transition or guard failed (codes invalid_transition, no_categories, active_tournament_exists, registration_window_past, draw_published, no_draw, categories_unfinished)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'

  /api/admin/tournaments/{tournament_id}/categories:
    parameters:
      - {name: tournament_id, in: path, required: true, schema: {type: integer}}
    post:
      tags: [Tournaments]
      summary: Create a category
      description: groups_knockout needs group_target_size (3 or 4), qualifiers_per_group (1 or 2) and min_entries of at least 6. Group settings are dropped for other formats.
      security:
        - BearerAuth: []
      requestBody:
