name: Unit Tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_lapen_agenda
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-local.txt
        pip install pytest pytest-cov
    
    - name: Initialize database
      env:
        DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_lapen_agenda
      run: |
        python -c "from src.database import get_db; db = get_db(); cursor = db.cursor(); cursor.execute(open('src/database/postgres_schema.sql').read()); cursor.execute('INSERT INTO courts (id, name, type, description, active) VALUES (1, \'Test Court\', \'Saibro\', \'Test court for CI\', true)'); db.commit(); db.close()"
    
    - name: Run unit tests
      env:
        DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_lapen_agenda
        SECRET_KEY: test-secret-key-for-github-actions-minimum-32-characters
        ADMIN_PASSWORD: test-admin-password
        MAIL_USERNAME: test@example.com
        MAIL_PASSWORD: test-password
        MERCADOPAGO_ACCESS_TOKEN: test-token
        MERCADOPAGO_PUBLIC_KEY: test-key
      run: |
        pytest tests/ --cov=src --cov-report=term-missing