  /api/admin/tournaments/{tournament_id}/registrations/{registration_id}:
    parameters:
      - {name: tournament_id, in: path, required: true, schema: {type: integer}}
      - {name: registration_id, in: path, required: true, schema: {type: integer}}
    patch:
      tags: [Tournaments]
      summary: Edit a registration (any subset of the fields)
      description: |
        status follows pending to confirmed/rejected/cancelled, waitlist to pending/confirmed/rejected/cancelled, confirmed to cancelled/withdrawn and rejected or cancelled back to pending (reopen).
        Reopening is only possible before the draw, clears the rejection reason and the seed, and does not use a place (the capacity is checked when it is confirmed again). It fails with duplicate_email or duplicate_member when the same person already holds a live registration in the category. withdrawn is final.
        After the draw only withdrawn is allowed for confirmed entries, and it turns that player's pending matches into walkovers for the opponents (what was played stays). user_id links an approved LAPEN member (null unlinks).
        seed needs a confirmed registration and a category with num_seeds. category_id moves it before the draw.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: {type: string, enum: [pending, confirmed, rejected, cancelled, withdrawn]}
                rejection_reason: {type: string}
                user_id: {type: integer, nullable: true}
                seed: {type: integer, nullable: true}
                category_id: {type: integer}
                full_name: {type: string}
                display_name: {type: string}
                email: {type: string}
                phone: {type: string}
                notes: {type: string}
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  registration: {$ref: '#/components/schemas/TournamentRegistration'}
        '400':
          description: Invalid data or user is not an approved LAPEN member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'
        '409':
          description: Invalid transition, category_full, draw_exists, seed_taken, duplicate_email, duplicate_member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'

  /api/tournaments/{slug}/registrations:
    post:
      tags: [Tournaments]
      summary: Public tournament sign-up
      description: |
        No login needed. With a valid token of an approved LAPEN member the registration is linked to that member.
        The registration starts as pending, or waitlist when the category already has all its places confirmed.
        At most 5 sign-ups per hour per client address. The response never contains contact data.
        The field website is a honeypot: when filled the API answers 201 and stores nothing.
      parameters:
        - {name: slug, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category_id, full_name, email, phone, accepted_terms, data_consent]
              properties:
                category_id: {type: integer}
                full_name: {type: string}
                display_name: {type: string, description: Defaults to the first two names}
                email: {type: string}
                phone: {type: string, description: "With area code, 10 to 13 digits"}
                notes: {type: string, maxLength: 500}
                accepted_terms: {type: boolean, description: Must be true}
                data_consent: {type: boolean, description: Must be true}
                website: {type: string, description: "Honeypot, leave empty"}
      responses:
        '201':
          description: Received
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: {type: string}
                  waitlisted: {type: boolean}
                  registration:
                    type: object
                    nullable: true
                    properties:
                      id: {type: integer}
                      category_id: {type: integer}
                      display_name: {type: string}
                      status: {type: string, enum: [pending, waitlist]}
        '400':
          description: Invalid data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'
        '404':
          description: Tournament, category or draft not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'
        '409':
          description: Registrations not open yet or closed (codes registration_not_started, registration_closed), duplicate e-mail or member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'
        '429':
          description: Rate limited (code rate_limited)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'

  /api/admin/tournaments/{tournament_id}/categories/{category_id}/draw:
    parameters:
      - {name: tournament_id, in: path, required: true, schema: {type: integer}}
      - {name: category_id, in: path, required: true, schema: {type: integer}}
    get:
      tags: [Tournaments]
      summary: Groups and bracket of a category (preview or published)
      description: Without a draw, groups is empty and knockout is null.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: The draw
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TournamentDraw'}
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'
    post:
      tags: [Tournaments]
      summary: Draw (or redraw) the preview from the confirmed registrations
      description: |
        Needs registrations closed (tournament registration_closed or in_progress) and no published draw.
        Seeds (registration seed 1..n, no gaps) follow the ITF placement: seed 1 on the first line, seed 2 on the last,
        3-4 and 5-8 drawn in their quarters and eighths. Byes go to the top seeds first and are then spread evenly.
        groups_knockout deals seeds in a snake over balanced groups (3 or 4 players, none below 3) and, when
        groups x qualifiers is a power of two, builds the knockout skeleton at once with slots such as "1o Grupo A"
        (a runner-up never lands in the half of its own group winner). Otherwise knockout_pending is true.
        The random seed of the draw is stored in the audit log (action draw_generated) so it can be replayed.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: The draw
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TournamentDraw'}
        '400':
          description: not_enough_entries, invalid_seeds or draw_failed (for example too many seeds)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'
        '409':
          description: registration_not_closed, draw_published or tournament_locked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'
    put:
      tags: [Tournaments]
      summary: Swap two entries in the preview
      description: Exchanges their places in the bracket (a bye follows its new player) or moves them between groups. Only while the category is in preview (drawn).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [swap]
              properties:
                swap:
                  type: array
                  minItems: 2
                  maxItems: 2
                  items: {type: integer, description: Registration id}
      responses:
        '200':
          description: The draw
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TournamentDraw'}
        '400':
          description: Not two different registrations, or both already in the same group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'
        '404':
          description: Registration not in this draw
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'
        '409':
          description: not_preview, registration_not_closed or tournament_locked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'
    delete:
      tags: [Tournaments]
      summary: Undo the draw (back to awaiting_draw)
      description: Allowed while no result has been recorded. Byes do not count as results.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Undone
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'
        '409':
          description: no_draw, results_exist or tournament_locked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'

  /api/admin/tournaments/{tournament_id}/categories/{category_id}/draw/publish:
    parameters:
      - {name: tournament_id, in: path, required: true, schema: {type: integer}}
      - {name: category_id, in: path, required: true, schema: {type: integer}}
    post:
      tags: [Tournaments]
      summary: Publish the previewed draw
      description: Freezes the draw. The confirmed registrations can no longer change and the draw cannot be redone without undoing it first. Recorded in the audit log with who sits where.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: The draw
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TournamentDraw'}
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'
        '409':
          description: not_drawn, registration_not_closed or tournament_locked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'

  /api/admin/tournaments/{tournament_id}/matches/{match_id}/result:
    parameters:
      - {name: tournament_id, in: path, required: true, schema: {type: integer}}
      - {name: match_id, in: path, required: true, schema: {type: integer}}
    put:
      tags: [Tournaments]
      summary: Record the result of a match
      description: |
        Needs the tournament in progress, the draw published and both players known. Byes have no result.
        Knockout: the winner moves into the next match. A double walkover leaves a void slot, so the opponent there advances by a bye.
        Groups: when every group is settled the qualifiers enter the knockout phase (drawn then, with byes to the best campaigns, when they do not fill a bracket).
        Statistics: a row is written when at least one player is a LAPEN member (not for byes or double walkovers).
        Everything happens in one transaction. Two simultaneous requests for the same match: one 200, one 409 result_exists.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                outcome:
                  type: string
                  enum: [normal, wo, double_wo, retired]
                  default: normal
                winner_registration_id: {type: integer, description: Required except for double_wo. For retired, the player who stays}
                score: {type: string, example: "6-4, 3-6, 10-8", description: "Required for normal and retired. Written from the first player's side. The winner must match it. Validated against the tournament match_format and match_tiebreak_points, with strict sets (6-0 to 6-4, 7-5, 7-6). A retired score has finished sets plus at most one unfinished set"}
                played_at: {type: string, example: "2026-11-10", description: Defaults to the planned time of the match, or now}
      responses:
        '200':
          description: The updated draw (and the group tables for group formats)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TournamentResult'}
        '400':
          description: Invalid outcome, winner or score (codes invalid_score, winner_mismatch)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'
        '409':
          description: result_exists, tournament_not_started, draw_not_published, bye_match, match_not_ready or tournament_locked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'
    patch:
      tags: [Tournaments]
      summary: Correct a recorded result
      description: |
        Same body as PUT. Allowed while the next match has no result typed by an admin (automatic byes and walkovers downstream are undone and redone).
        For a group match: while the knockout phase has no typed result. A correction drops any tie decision of that group.
        The statistics row is updated in place.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                outcome:
                  type: string
                  enum: [normal, wo, double_wo, retired]
                  default: normal
                winner_registration_id: {type: integer, description: Required except for double_wo. For retired, the player who stays}
                score: {type: string, example: "6-4, 3-6, 10-8", description: "Required for normal and retired. Written from the first player's side. The winner must match it. Validated against the tournament match_format and match_tiebreak_points, with strict sets (6-0 to 6-4, 7-5, 7-6). A retired score has finished sets plus at most one unfinished set"}
                played_at: {type: string, example: "2026-11-10", description: Defaults to the planned time of the match, or now}
      responses:
        '200':
          description: The updated draw (and the group tables for group formats)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TournamentResult'}
        '400':
          description: Invalid outcome, winner or score
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'
        '409':
          description: no_result, next_match_played, automatic_result or the same states as PUT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'
    delete:
      tags: [Tournaments]
      summary: Annul a result (back to pending)
      description: Same rules as the correction. Removes the statistics row and takes the winner out of the next match.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: The updated draw (and the group tables for group formats)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TournamentResult'}
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'
        '409':
          description: no_result, next_match_played or automatic_result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'

  /api/admin/tournaments/{tournament_id}/categories/{category_id}/standings:
    parameters:
      - {name: tournament_id, in: path, required: true, schema: {type: integer}}
      - {name: category_id, in: path, required: true, schema: {type: integer}}
    get:
      tags: [Tournaments]
      summary: Group tables of a category
      description: |
        ATP round-robin order: wins, matches played on court, head-to-head (two players tied), % of sets, % of games, then the organizer.
        A finished super tiebreak counts 1 set and 1 game to 0. A walkover is a win or a loss with no sets or games.
        A retirement keeps the sets and games played. A double walkover is a loss for both.
        Empty groups for knockout categories.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Tables
          content:
            application/json:
              schema:
                type: object
                properties:
                  category: {$ref: '#/components/schemas/TournamentCategory'}
                  qualifiers_per_group: {type: integer}
                  groups:
                    type: array
                    items: {$ref: '#/components/schemas/TournamentGroupStandings'}
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'

  /api/admin/tournaments/{tournament_id}/groups/{group_id}/tiebreak:
    parameters:
      - {name: tournament_id, in: path, required: true, schema: {type: integer}}
      - {name: group_id, in: path, required: true, schema: {type: integer}}
    put:
      tags: [Tournaments]
      summary: Decide a tie the criteria could not break
      description: |
        Send exactly the players of one tied set (see ties in the standings), best first. Only after the group is complete,
        and while the knockout phase has no typed result. The decision is dropped when a result of the group changes.
        A tie only blocks the group when it reaches the qualifying places.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order]
              properties:
                order:
                  type: array
                  minItems: 2
                  items: {type: integer, description: Registration id}
      responses:
        '200':
          description: The tables after the decision
          content:
            application/json:
              schema:
                type: object
                properties:
                  category: {$ref: '#/components/schemas/TournamentCategory'}
                  qualifiers_per_group: {type: integer}
                  groups:
                    type: array
                    items: {$ref: '#/components/schemas/TournamentGroupStandings'}
        '400':
          description: Not a list of two or more different registrations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'
        '404':
          description: Group not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'
        '409':
          description: group_not_complete, not_a_tie, next_match_played or tournament_locked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'

