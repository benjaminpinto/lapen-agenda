              schema:
                $ref: '#/components/schemas/TournamentError'
        '409':
          description: Not a draft (code not_draft)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'
        '403':
