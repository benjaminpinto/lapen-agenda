    post:
      tags: [Tournaments]
      summary: Create a session
      description: |
        A session is a stretch of one day when some courts belong to the tournament, cut into 90 minute windows from its start time (only whole windows fit). The date must be inside the tournament period. Two sessions cannot overlap on the same court.
