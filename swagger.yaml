          description: Tournaments
          content:
            application/json:
              schema:
                type: object
                properties:
                  tournaments:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/Tournament'
                        - type: object
                          properties:
                            categories_count: {type: integer}
                            pending_registrations: {type: integer}
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'
    post:
      tags: [Tournaments]
      summary: Create a tournament (always starts as draft)
      description: The slug is generated from the name unless given. Defaults match_format best_of_3_super_tb, no_ad true, match_tiebreak_points 10.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, start_date, end_date]
              properties:
                name: {type: string}
                slug: {type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'}
                description: {type: string}
                location: {type: string}
                start_date: {type: string, format: date}
                end_date: {type: string, format: date}
                registration_opens_at: {type: string, example: "2026-11-01T08:00"}
                registration_closes_at: {type: string, example: "2026-11-08T18:00"}
                rules_text: {type: string}
                contact_info: {type: string}
                match_format: {type: string, enum: [best_of_3_super_tb, pro_set_8, single_set_6]}
                no_ad: {type: boolean}
                match_tiebreak_points: {type: integer}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  tournament: {$ref: '#/components/schemas/Tournament'}
        '400':
          description: Invalid data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'
        '409':
          description: Slug already taken (code slug_taken)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'

