  /api/admin/tournaments/{tournament_id}/schedule/distribute:
    parameters:
      - {name: tournament_id, in: path, required: true, schema: {type: integer}}
    post:
      tags: [Tournaments]
      summary: Propose where to put the pending matches
      description: |
        Writes nothing. Greedy construction by phase and round (the most constrained players first), then a local search by swaps and moves, deterministic for a given rng_seed. Hard rules: one match per window, no person in two places, rest between matches of a person and after the matches that feed a match, no match before them, unavailability, pinned and played matches untouched. Soft goals: finish early, short waits, at most 2 matches per person per day, rounds aligned.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                category_ids: {type: array, items: {type: integer}, description: Default all categories with a published draw}
                stage: {type: string, enum: [group, knockout]}
                round_number: {type: integer, description: Only with stage knockout}
                session_ids: {type: array, items: {type: integer}, description: Default all sessions}
                from: {type: string, example: "2099-02-10T14:00", description: Local time. Nothing is placed before it}
                redo: {type: boolean, description: Also replace matches that already have a window (pinned ones stay)}
                rng_seed: {type: integer}
      responses:
        '200':
          description: The proposal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleProposal'
        '400':
          description: Invalid data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'

  /api/admin/tournaments/{tournament_id}/schedule/apply:
    parameters:
      - {name: tournament_id, in: path, required: true, schema: {type: integer}}
    post:
      tags: [Tournaments]
      summary: Apply a proposal
      description: |
        Revalidates everything in one transaction. A proposal that went stale (a window was taken or blocked, or it would create a conflict) is refused with code stale_proposal and nothing is written.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assignments]
              properties:
                assignments:
                  type: array
                  items:
                    type: object
                    properties:
                      match_id: {type: integer}
                      court_id: {type: integer}
                      date: {type: string, format: date}
                      time: {type: string}
                unassign: {type: array, items: {type: integer}}
      responses:
        '200':
          description: The schedule after the change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
        '400':
          description: Invalid data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'
        '409':
          description: Refused (see code)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentError'

  /api/admin/tournaments/{tournament_id}/schedule/publish:
    parameters:
      - {name: tournament_id, in: path, required: true, schema: {type: integer}}
    post:
      tags: [Tournaments]
      summary: Publish the schedule
      description: |
        Until then the public sees no date, time or court. Needs at least one scheduled match (nothing_to_publish). After publishing, changes are public at once.
      security:
