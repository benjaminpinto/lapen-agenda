                draw_format: {type: string, enum: [knockout, round_robin, groups_knockout], default: knockout}
                min_entries: {type: integer, default: 4}
                max_entries: {type: integer, nullable: true}
                group_target_size: {type: integer, enum: [3, 4]}
                qualifiers_per_group: {type: integer, enum: [1, 2]}
                num_seeds: {type: integer, default: 0}
                wo_tolerance_min: {type: integer, default: 15}
                min_rest_min: {type: integer, default: 30}
                sort_order: {type: integer}
